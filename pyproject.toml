[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["timba-trade*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"timba-trade" = ["assets/*.css", "assets/*.js", "assets/*.png"]

[project]
name = "timba-trade"
version = "0.1.0"
description = """
An add-on for TiMBA to obtain bilateral Trade from scenario output.
"""
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "click==8.1.7",
    "numpy>=1.26",
    "pandas>=2.0",
    "xarray>=2023.1",
    "joblib>=1.3",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.2.1"
]
